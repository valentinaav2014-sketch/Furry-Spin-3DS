
name: Build Furry Spin 3DS

'on':
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001

    steps:
      - uses: actions/checkout@v4

            - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: python -m pip install --user pillow

      - name: Prepare animation
        run: python templates/application/prepare_animation.py

      - name: Build
        run: make -C templates/application

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: Furry-Spin-3DS
          path: templates/application/*.3dsx
          if-no-files-found: error
